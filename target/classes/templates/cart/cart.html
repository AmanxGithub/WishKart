<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Shopping Cart')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="container py-4">
    <h2 class="mb-4"><i class="bi bi-cart3 me-2"></i>Shopping Cart</h2>

    <div id="cartLoading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div id="emptyCart" class="text-center py-5 d-none">
        <i class="bi bi-cart-x fs-1 text-muted"></i>
        <h4 class="mt-3">Your cart is empty</h4>
        <p class="text-muted">Looks like you haven't added any items yet.</p>
        <a th:href="@{/products}" class="btn btn-primary">Start Shopping</a>
    </div>

    <div id="cartContent" class="row d-none">
        <div class="col-lg-8">
            <div class="card mb-4">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span><strong id="itemCount">0</strong> items in your cart</span>
                    <button class="btn btn-outline-danger btn-sm" onclick="clearCart()">
                        <i class="bi bi-trash me-1"></i>Clear Cart
                    </button>
                </div>
                <div class="card-body p-0">
                    <div id="cartItems"></div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">Order Summary</h5>
                </div>
                <div class="card-body">
                    <div class="d-flex justify-content-between mb-2">
                        <span>Subtotal</span>
                        <span id="subtotal">₹0</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Shipping</span>
                        <span id="shipping">Calculated at checkout</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2" id="discountRow" style="display: none !important;">
                        <span>Discount</span>
                        <span class="text-success" id="discount">-₹0</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between mb-3">
                        <strong>Total</strong>
                        <strong class="text-primary" id="total">₹0</strong>
                    </div>

                    <!-- Coupon -->
                    <div class="mb-3">
                        <div class="input-group">
                            <input type="text" class="form-control" id="couponCode" placeholder="Coupon code">
                            <button class="btn btn-outline-secondary" onclick="applyCoupon()">Apply</button>
                        </div>
                    </div>

                    <a th:href="@{/checkout}" class="btn btn-primary w-100">
                        <i class="bi bi-lock me-1"></i>Proceed to Checkout
                    </a>

                    <div class="mt-3 text-center">
                        <small class="text-muted">
                            <i class="bi bi-shield-check me-1"></i>Secure checkout
                        </small>
                    </div>
                </div>
            </div>

            <div class="card mt-3">
                <div class="card-body">
                    <h6><i class="bi bi-truck me-2"></i>Free Shipping</h6>
                    <p class="small text-muted mb-0">On orders over ₹999</p>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<th:block th:replace="~{fragments/footer :: scripts}"></th:block>

<script>
    document.addEventListener('DOMContentLoaded', loadCart);

    // Format INR currency
    function formatINR(amount) {
        return '₹' + new Intl.NumberFormat('en-IN').format(Math.round(amount || 0));
    }

    async function loadCart() {
        const loading = document.getElementById('cartLoading');
        const empty = document.getElementById('emptyCart');
        const content = document.getElementById('cartContent');

        try {
            const response = await fetchWithAuth('/api/cart');
            const data = await response.json();

            loading.classList.add('d-none');

            if (data.success && data.data.items.length > 0) {
                content.classList.remove('d-none');
                renderCart(data.data);
            } else {
                empty.classList.remove('d-none');
            }
        } catch (error) {
            loading.classList.add('d-none');
            empty.classList.remove('d-none');
        }
    }

    function renderCart(cart) {
        const itemsContainer = document.getElementById('cartItems');
        itemsContainer.innerHTML = cart.items.map(item => `
            <div class="d-flex p-3 border-bottom" id="cart-item-${item.productId}">
                <img src="${item.productImage || 'https://via.placeholder.com/100x100?text=Product'}" alt="${item.productName}"
                     style="width: 100px; height: 100px; object-fit: cover;" class="rounded">
                <div class="ms-3 flex-grow-1">
                    <h6 class="mb-1">
                        <a href="/products/${item.productSlug}" class="text-decoration-none text-dark">
                            ${item.productName}
                        </a>
                    </h6>
                    <p class="text-muted small mb-2">SKU: ${item.productSku}</p>
                    <p class="fw-bold text-primary mb-2">${formatINR(item.price)}</p>
                    <div class="d-flex align-items-center">
                        <div class="input-group" style="width: 120px;">
                            <button class="btn btn-outline-secondary btn-sm" onclick="updateQuantity(${item.productId}, ${item.quantity - 1})">-</button>
                            <input type="text" class="form-control form-control-sm text-center" value="${item.quantity}" readonly>
                            <button class="btn btn-outline-secondary btn-sm" onclick="updateQuantity(${item.productId}, ${item.quantity + 1})">+</button>
                        </div>
                        <button class="btn btn-link text-danger ms-3" onclick="removeFromCart(${item.productId})">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                </div>
                <div class="text-end">
                    <strong>${formatINR(item.total)}</strong>
                </div>
            </div>
        `).join('');

        document.getElementById('itemCount').textContent = cart.totalItems;
        document.getElementById('subtotal').textContent = formatINR(cart.subtotal);
        document.getElementById('total').textContent = formatINR(cart.total);

        if (cart.discountAmount > 0) {
            document.getElementById('discountRow').style.display = 'flex !important';
            document.getElementById('discount').textContent = '-' + formatINR(cart.discountAmount);
        }

        updateCartBadge(cart.totalItems);
    }

    async function updateQuantity(productId, quantity) {
        if (quantity < 1) {
            removeFromCart(productId);
            return;
        }

        try {
            const response = await fetchWithAuth(`/api/cart/update/${productId}?quantity=${quantity}`, {
                method: 'PUT'
            });
            const data = await response.json();
            if (data.success) {
                renderCart(data.data);
            }
        } catch (error) {
            showToast('Failed to update quantity', 'error');
        }
    }

    async function removeFromCart(productId) {
        try {
            const response = await fetchWithAuth(`/api/cart/remove/${productId}`, {
                method: 'DELETE'
            });
            const data = await response.json();
            if (data.success) {
                if (data.data.items.length === 0) {
                    location.reload();
                } else {
                    renderCart(data.data);
                }
                showToast('Item removed from cart');
            }
        } catch (error) {
            showToast('Failed to remove item', 'error');
        }
    }

    async function clearCart() {
        if (!confirm('Are you sure you want to clear your cart?')) return;

        try {
            const response = await fetchWithAuth('/api/cart/clear', { method: 'DELETE' });
            const data = await response.json();
            if (data.success) {
                location.reload();
            }
        } catch (error) {
            showToast('Failed to clear cart', 'error');
        }
    }
</script>
</body>
</html>
