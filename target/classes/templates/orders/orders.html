<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('My Orders')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="container py-4">
    <h2 class="mb-4"><i class="bi bi-box-seam me-2"></i>My Orders</h2>

    <div id="ordersLoading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div id="noOrders" class="text-center py-5 d-none">
        <i class="bi bi-box fs-1 text-muted"></i>
        <h4 class="mt-3">No orders yet</h4>
        <p class="text-muted">Start shopping to see your orders here!</p>
        <a href="/products" class="btn btn-primary">Browse Products</a>
    </div>

    <div id="ordersList" class="d-none"></div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<th:block th:replace="~{fragments/footer :: scripts}"></th:block>

<script>
    document.addEventListener('DOMContentLoaded', loadOrders);

    // Format INR currency
    function formatINR(amount) {
        return '₹' + new Intl.NumberFormat('en-IN').format(Math.round(amount || 0));
    }

    function getStatusBadge(status) {
        const badges = {
            'PENDING': 'bg-warning',
            'CONFIRMED': 'bg-info',
            'PROCESSING': 'bg-primary',
            'SHIPPED': 'bg-purple',
            'DELIVERED': 'bg-success',
            'CANCELLED': 'bg-danger',
            'REFUNDED': 'bg-secondary'
        };
        return badges[status] || 'bg-secondary';
    }

    async function loadOrders() {
        const loading = document.getElementById('ordersLoading');
        const noOrders = document.getElementById('noOrders');
        const ordersList = document.getElementById('ordersList');

        try {
            const response = await fetchWithAuth('/api/orders');
            const data = await response.json();

            loading.classList.add('d-none');

            if (data.success && data.data.content && data.data.content.length > 0) {
                ordersList.classList.remove('d-none');
                renderOrders(data.data.content);
            } else {
                noOrders.classList.remove('d-none');
            }
        } catch (error) {
            loading.classList.add('d-none');
            noOrders.classList.remove('d-none');
        }
    }

    function renderOrders(orders) {
        const container = document.getElementById('ordersList');
        container.innerHTML = orders.map(order => `
            <div class="card mb-3">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <div>
                        <strong>Order #${order.orderNumber}</strong>
                        <span class="text-muted ms-3">
                            <i class="bi bi-calendar me-1"></i>
                            ${new Date(order.createdAt).toLocaleDateString('en-IN', { 
                                year: 'numeric', 
                                month: 'long', 
                                day: 'numeric' 
                            })}
                        </span>
                    </div>
                    <span class="badge ${getStatusBadge(order.status)}">${order.status}</span>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-8">
                            ${order.items ? order.items.map(item => `
                                <div class="d-flex align-items-center mb-2">
                                    <img src="${item.productImage || 'https://via.placeholder.com/60x60?text=Product'}" 
                                         alt="${item.productName}"
                                         style="width: 60px; height: 60px; object-fit: cover;"
                                         class="rounded me-3">
                                    <div>
                                        <div class="fw-medium">${item.productName}</div>
                                        <small class="text-muted">Qty: ${item.quantity} × ${formatINR(item.unitPrice)}</small>
                                    </div>
                                </div>
                            `).join('') : `<p class="text-muted">${order.totalItemCount || 0} item(s)</p>`}
                        </div>
                        <div class="col-md-4 text-md-end">
                            <div class="mb-2">
                                <strong class="fs-5">${formatINR(order.totalAmount)}</strong>
                            </div>
                            ${order.paymentMethod ? `
                                <small class="text-muted d-block">
                                    <i class="bi bi-credit-card me-1"></i>${order.paymentMethod}
                                </small>
                            ` : ''}
                            ${order.trackingNumber ? `
                                <small class="text-muted d-block mt-1">
                                    <i class="bi bi-truck me-1"></i>Tracking: ${order.trackingNumber}
                                </small>
                            ` : ''}
                        </div>
                    </div>
                </div>
                <div class="card-footer bg-transparent">
                    <div class="d-flex justify-content-between align-items-center">
                        <small class="text-muted">
                            ${order.shippingAddress ? `
                                <i class="bi bi-geo-alt me-1"></i>
                                ${order.shippingAddress.city || ''}, ${order.shippingAddress.state || ''}
                            ` : ''}
                        </small>
                        <div>
                            ${order.status === 'DELIVERED' ? `
                                <button class="btn btn-sm btn-outline-primary me-2" onclick="reorder(${order.id})">
                                    <i class="bi bi-arrow-repeat me-1"></i>Reorder
                                </button>
                            ` : ''}
                            ${['PENDING', 'CONFIRMED'].includes(order.status) ? `
                                <button class="btn btn-sm btn-outline-danger" onclick="cancelOrder(${order.id})">
                                    <i class="bi bi-x-circle me-1"></i>Cancel
                                </button>
                            ` : ''}
                        </div>
                    </div>
                </div>
            </div>
        `).join('');
    }

    async function cancelOrder(orderId) {
        if (!confirm('Are you sure you want to cancel this order?')) return;

        try {
            const response = await fetchWithAuth(`/api/orders/${orderId}/cancel`, {
                method: 'POST'
            });

            const data = await response.json();

            if (data.success) {
                showToast('Order cancelled successfully', 'success');
                loadOrders();
            } else {
                showToast(data.message || 'Failed to cancel order', 'error');
            }
        } catch (error) {
            showToast('Failed to cancel order', 'error');
        }
    }

    function reorder(orderId) {
        showToast('Reorder feature coming soon!', 'info');
    }
</script>
</body>
</html>
