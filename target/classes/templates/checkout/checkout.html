<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Checkout')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="container py-4">
    <h2 class="mb-4"><i class="bi bi-credit-card me-2"></i>Checkout</h2>

    <div id="checkoutLoading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div id="checkoutContent" class="row d-none">
        <!-- Shipping & Payment Form -->
        <div class="col-lg-8">
            <form id="checkoutForm">
                <!-- Shipping Address -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="bi bi-geo-alt me-2"></i>Shipping Address</h5>
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">First Name *</label>
                                <input type="text" class="form-control" id="firstName" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Last Name *</label>
                                <input type="text" class="form-control" id="lastName" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Email *</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Phone *</label>
                                <input type="tel" class="form-control" id="phone" placeholder="+91 9876543210" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Address Line 1 *</label>
                                <input type="text" class="form-control" id="addressLine1" placeholder="House/Flat No., Building Name" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Address Line 2</label>
                                <input type="text" class="form-control" id="addressLine2" placeholder="Street, Landmark">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">City *</label>
                                <input type="text" class="form-control" id="city" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">State *</label>
                                <select class="form-select" id="state" required>
                                    <option value="">Select State</option>
                                    <option value="AN">Andaman and Nicobar Islands</option>
                                    <option value="AP">Andhra Pradesh</option>
                                    <option value="AR">Arunachal Pradesh</option>
                                    <option value="AS">Assam</option>
                                    <option value="BR">Bihar</option>
                                    <option value="CH">Chandigarh</option>
                                    <option value="CT">Chhattisgarh</option>
                                    <option value="DD">Daman and Diu</option>
                                    <option value="DL">Delhi</option>
                                    <option value="GA">Goa</option>
                                    <option value="GJ">Gujarat</option>
                                    <option value="HR">Haryana</option>
                                    <option value="HP">Himachal Pradesh</option>
                                    <option value="JK">Jammu and Kashmir</option>
                                    <option value="JH">Jharkhand</option>
                                    <option value="KA">Karnataka</option>
                                    <option value="KL">Kerala</option>
                                    <option value="LA">Ladakh</option>
                                    <option value="LD">Lakshadweep</option>
                                    <option value="MP">Madhya Pradesh</option>
                                    <option value="MH">Maharashtra</option>
                                    <option value="MN">Manipur</option>
                                    <option value="ML">Meghalaya</option>
                                    <option value="MZ">Mizoram</option>
                                    <option value="NL">Nagaland</option>
                                    <option value="OR">Odisha</option>
                                    <option value="PY">Puducherry</option>
                                    <option value="PB">Punjab</option>
                                    <option value="RJ">Rajasthan</option>
                                    <option value="SK">Sikkim</option>
                                    <option value="TN">Tamil Nadu</option>
                                    <option value="TG">Telangana</option>
                                    <option value="TR">Tripura</option>
                                    <option value="UP">Uttar Pradesh</option>
                                    <option value="UK">Uttarakhand</option>
                                    <option value="WB">West Bengal</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">PIN Code *</label>
                                <input type="text" class="form-control" id="zipCode" pattern="[0-9]{6}" maxlength="6" required>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Payment Method -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="bi bi-wallet2 me-2"></i>Payment Method</h5>
                    </div>
                    <div class="card-body">
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="radio" name="paymentMethod" id="cod" value="COD" checked>
                            <label class="form-check-label" for="cod">
                                <i class="bi bi-cash me-2"></i>Cash on Delivery
                            </label>
                            <small class="d-block text-muted ms-4">Pay when you receive your order</small>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="radio" name="paymentMethod" id="card" value="CARD">
                            <label class="form-check-label" for="card">
                                <i class="bi bi-credit-card me-2"></i>Credit/Debit Card
                            </label>
                            <small class="d-block text-muted ms-4">Visa, Mastercard, RuPay</small>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="radio" name="paymentMethod" id="upi" value="UPI">
                            <label class="form-check-label" for="upi">
                                <i class="bi bi-phone me-2"></i>UPI
                            </label>
                            <small class="d-block text-muted ms-4">GPay, PhonePe, Paytm, BHIM</small>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="paymentMethod" id="netbanking" value="NETBANKING">
                            <label class="form-check-label" for="netbanking">
                                <i class="bi bi-bank me-2"></i>Net Banking
                            </label>
                            <small class="d-block text-muted ms-4">All major banks supported</small>
                        </div>
                    </div>
                </div>
            </form>
        </div>

        <!-- Order Summary -->
        <div class="col-lg-4">
            <div class="card sticky-top" style="top: 80px;">
                <div class="card-header">
                    <h5 class="mb-0"><i class="bi bi-receipt me-2"></i>Order Summary</h5>
                </div>
                <div class="card-body">
                    <div id="orderItems" class="mb-3"></div>
                    
                    <hr>
                    
                    <div class="d-flex justify-content-between mb-2">
                        <span>Subtotal</span>
                        <span id="subtotal">₹0</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Shipping</span>
                        <span id="shipping" class="text-success">FREE</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2" id="discountRow" style="display: none;">
                        <span>Discount</span>
                        <span class="text-success" id="discount">-₹0</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Tax (GST 18%)</span>
                        <span id="tax">₹0</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between mb-3">
                        <strong>Total</strong>
                        <strong class="text-primary fs-5" id="total">₹0</strong>
                    </div>

                    <div id="checkoutError" class="alert alert-danger d-none mb-3"></div>

                    <button type="button" class="btn btn-primary btn-lg w-100" onclick="placeOrder()" id="placeOrderBtn">
                        <span class="spinner-border spinner-border-sm d-none me-2" id="orderSpinner"></span>
                        <i class="bi bi-lock me-2"></i>Place Order
                    </button>

                    <div class="mt-3 text-center">
                        <small class="text-muted">
                            <i class="bi bi-shield-check me-1"></i>Secure checkout powered by SSL
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<th:block th:replace="~{fragments/footer :: scripts}"></th:block>

<script>
    let cartData = null;

    document.addEventListener('DOMContentLoaded', loadCheckout);

    // Format INR currency
    function formatINR(amount) {
        return '₹' + new Intl.NumberFormat('en-IN').format(Math.round(amount || 0));
    }

    async function loadCheckout() {
        const loading = document.getElementById('checkoutLoading');
        const content = document.getElementById('checkoutContent');

        try {
            const response = await fetchWithAuth('/api/cart');
            const data = await response.json();

            loading.classList.add('d-none');

            if (data.success && data.data.items.length > 0) {
                cartData = data.data;
                content.classList.remove('d-none');
                renderOrderSummary(data.data);
                prefillUserData();
            } else {
                window.location.href = '/cart';
            }
        } catch (error) {
            window.location.href = '/cart';
        }
    }

    function renderOrderSummary(cart) {
        const itemsContainer = document.getElementById('orderItems');
        itemsContainer.innerHTML = cart.items.map(item => `
            <div class="d-flex justify-content-between align-items-start mb-2">
                <div class="d-flex">
                    <img src="${item.productImage || 'https://via.placeholder.com/50x50?text=Product'}" 
                         style="width: 50px; height: 50px; object-fit: cover;" class="rounded me-2">
                    <div>
                        <small class="d-block">${item.productName}</small>
                        <small class="text-muted">Qty: ${item.quantity}</small>
                    </div>
                </div>
                <small class="fw-bold">${formatINR(item.total)}</small>
            </div>
        `).join('');

        const subtotal = cart.subtotal;
        const tax = Math.round(subtotal * 0.18);
        const shipping = subtotal >= 999 ? 0 : 99;
        const discount = cart.discountAmount || 0;
        const total = subtotal + tax + shipping - discount;

        document.getElementById('subtotal').textContent = formatINR(subtotal);
        document.getElementById('shipping').textContent = shipping === 0 ? 'FREE' : formatINR(shipping);
        document.getElementById('tax').textContent = formatINR(tax);
        document.getElementById('total').textContent = formatINR(total);

        if (discount > 0) {
            document.getElementById('discountRow').style.display = 'flex';
            document.getElementById('discount').textContent = '-' + formatINR(discount);
        }
    }

    function prefillUserData() {
        const userStr = localStorage.getItem('user');
        if (userStr) {
            try {
                const user = JSON.parse(userStr);
                if (user.firstName) document.getElementById('firstName').value = user.firstName;
                if (user.lastName) document.getElementById('lastName').value = user.lastName;
                if (user.email) document.getElementById('email').value = user.email;
                if (user.phone) document.getElementById('phone').value = user.phone;
            } catch (e) {}
        }
    }

    async function placeOrder() {
        const btn = document.getElementById('placeOrderBtn');
        const spinner = document.getElementById('orderSpinner');
        const errorDiv = document.getElementById('checkoutError');

        // Validate form
        const form = document.getElementById('checkoutForm');
        if (!form.checkValidity()) {
            form.reportValidity();
            return;
        }

        btn.disabled = true;
        spinner.classList.remove('d-none');
        errorDiv.classList.add('d-none');

        const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;
        
        const orderData = {
            shippingAddress: {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                addressLine1: document.getElementById('addressLine1').value,
                addressLine2: document.getElementById('addressLine2').value || '',
                city: document.getElementById('city').value,
                state: document.getElementById('state').value,
                zipCode: document.getElementById('zipCode').value,
                country: 'India'
            },
            paymentMethod: paymentMethod
        };

        try {
            const response = await fetchWithAuth('/api/orders', {
                method: 'POST',
                body: JSON.stringify(orderData)
            });

            const data = await response.json();

            if (data.success) {
                showToast('Order placed successfully!', 'success');
                // Clear cart badge
                updateCartBadge(0);
                // Redirect to order confirmation
                window.location.href = '/orders/' + data.data.id + '?success=true';
            } else {
                errorDiv.textContent = data.message || 'Failed to place order';
                errorDiv.classList.remove('d-none');
            }
        } catch (error) {
            errorDiv.textContent = 'An error occurred. Please try again.';
            errorDiv.classList.remove('d-none');
        } finally {
            btn.disabled = false;
            spinner.classList.add('d-none');
        }
    }
</script>
</body>
</html>
