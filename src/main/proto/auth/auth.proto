syntax = "proto3";

package com.wishkart.grpc.auth;

option java_multiple_files = true;
option java_package = "com.wishkart.grpc.auth";
option java_outer_classname = "AuthProto";

import "google/protobuf/timestamp.proto";

service AuthService {
  // Register a new user
  rpc Register(RegisterRequest) returns (AuthResponse);

  // Login with credentials
  rpc Login(LoginRequest) returns (AuthResponse);

  // Refresh access token
  rpc RefreshToken(RefreshTokenRequest) returns (AuthResponse);

  // Request password reset
  rpc ForgotPassword(ForgotPasswordRequest) returns (ApiResponse);

  // Reset password with token
  rpc ResetPassword(ResetPasswordRequest) returns (ApiResponse);

  // Verify email
  rpc VerifyEmail(VerifyEmailRequest) returns (ApiResponse);
}

// Common messages
message ApiResponse {
  bool success = 1;
  string message = 2;
  google.protobuf.Timestamp timestamp = 3;
}

message RegisterRequest {
  string first_name = 1;
  string last_name = 2;
  string email = 3;
  string password = 4;
  string confirm_password = 5;
  string phone = 6;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message ForgotPasswordRequest {
  string email = 1;
}

message ResetPasswordRequest {
  string token = 1;
  string new_password = 2;
}

message VerifyEmailRequest {
  string token = 1;
}

message AuthResponse {
  bool success = 1;
  string message = 2;
  string access_token = 3;
  string refresh_token = 4;
  string token_type = 5;
  int64 expires_in = 6;
  UserInfo user = 7;
}

message UserInfo {
  int64 id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  string phone = 5;
  string role = 6;
  bool enabled = 7;
  bool email_verified = 8;
  google.protobuf.Timestamp created_at = 9;
}
