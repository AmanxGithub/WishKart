syntax = "proto3";

package com.wishkart.grpc.order;

option java_multiple_files = true;
option java_package = "com.wishkart.grpc.order";
option java_outer_classname = "OrderProto";

import "google/protobuf/timestamp.proto";

service OrderService {
  // Create order from cart (checkout)
  rpc Checkout(CheckoutRequest) returns (OrderResponse);

  // Get current user's orders
  rpc GetMyOrders(PaginationRequest) returns (OrderListResponse);

  // Get order by ID
  rpc GetOrderById(OrderIdRequest) returns (OrderResponse);

  // Get order by order number
  rpc GetOrderByNumber(OrderNumberRequest) returns (OrderResponse);

  // Cancel an order
  rpc CancelOrder(CancelOrderRequest) returns (OrderResponse);

  // Create payment intent
  rpc CreatePaymentIntent(PaymentIntentRequest) returns (PaymentIntentResponse);

  // Confirm payment
  rpc ConfirmPayment(ConfirmPaymentRequest) returns (OrderResponse);
}

// Common messages
message PaginationRequest {
  int32 page = 1;
  int32 size = 2;
  string sort_by = 3;
  string sort_direction = 4;
}

message PaginationInfo {
  int32 page = 1;
  int32 size = 2;
  int64 total_elements = 3;
  int32 total_pages = 4;
  bool first = 5;
  bool last = 6;
  bool has_next = 7;
  bool has_previous = 8;
}

message CheckoutRequest {
  string shipping_name = 1;
  string shipping_address_line1 = 2;
  string shipping_address_line2 = 3;
  string shipping_city = 4;
  string shipping_state = 5;
  string shipping_postal_code = 6;
  string shipping_country = 7;
  string shipping_phone = 8;
  string payment_method = 9;
  string coupon_code = 10;
  string customer_notes = 11;
  bool billing_same_as_shipping = 12;
}

message OrderIdRequest {
  int64 id = 1;
}

message OrderNumberRequest {
  string order_number = 1;
}

message CancelOrderRequest {
  int64 order_id = 1;
  string reason = 2;
}

message PaymentIntentRequest {
  int64 order_id = 1;
}

message ConfirmPaymentRequest {
  string payment_intent_id = 1;
}

message OrderItem {
  int64 id = 1;
  int64 product_id = 2;
  string product_name = 3;
  string product_image = 4;
  string sku = 5;
  string unit_price = 6;
  int32 quantity = 7;
  string subtotal = 8;
}

message Order {
  int64 id = 1;
  string order_number = 2;
  int64 user_id = 3;
  string user_name = 4;
  string user_email = 5;
  repeated OrderItem items = 6;
  string status = 7;
  string subtotal = 8;
  string shipping_cost = 9;
  string tax_amount = 10;
  string discount_amount = 11;
  string total_amount = 12;
  string coupon_code = 13;
  string payment_method = 14;
  string payment_status = 15;
  string payment_intent_id = 16;
  google.protobuf.Timestamp paid_at = 17;

  // Shipping info
  string shipping_name = 18;
  string shipping_address = 19;
  string shipping_city = 20;
  string shipping_state = 21;
  string shipping_postal_code = 22;
  string shipping_country = 23;
  string shipping_phone = 24;

  // Tracking
  string tracking_number = 25;
  google.protobuf.Timestamp shipped_at = 26;
  google.protobuf.Timestamp delivered_at = 27;
  google.protobuf.Timestamp cancelled_at = 28;
  string cancellation_reason = 29;

  string customer_notes = 30;
  int32 total_item_count = 31;
  google.protobuf.Timestamp created_at = 32;
}

message OrderResponse {
  bool success = 1;
  string message = 2;
  Order order = 3;
}

message OrderListResponse {
  bool success = 1;
  string message = 2;
  repeated Order orders = 3;
  PaginationInfo pagination = 4;
}

message PaymentIntentResponse {
  bool success = 1;
  string message = 2;
  string client_secret = 3;
  string payment_intent_id = 4;
  string amount = 5;
  string currency = 6;
}
