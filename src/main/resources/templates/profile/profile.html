<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('My Profile')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="container py-4">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-lg-3 mb-4">
            <div class="card">
                <div class="card-body text-center">
                    <div class="mb-3">
                        <i class="bi bi-person-circle" style="font-size: 80px; color: #6366f1;"></i>
                    </div>
                    <h5 id="profileName">Loading...</h5>
                    <p class="text-muted small" id="profileEmail">-</p>
                </div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item active">
                        <i class="bi bi-person me-2"></i>Profile
                    </li>
                    <li class="list-group-item">
                        <a href="/orders" class="text-decoration-none text-dark">
                            <i class="bi bi-box me-2"></i>My Orders
                        </a>
                    </li>
                    <li class="list-group-item">
                        <a href="#" class="text-decoration-none text-dark" onclick="showAddresses()">
                            <i class="bi bi-geo-alt me-2"></i>Addresses
                        </a>
                    </li>
                    <li class="list-group-item">
                        <a href="#" class="text-decoration-none text-dark" onclick="showChangePassword()">
                            <i class="bi bi-shield-lock me-2"></i>Change Password
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Main Content -->
        <div class="col-lg-9">
            <!-- Profile Info -->
            <div class="card mb-4" id="profileSection">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0"><i class="bi bi-person me-2"></i>Profile Information</h5>
                    <button class="btn btn-sm btn-outline-primary" onclick="enableEdit()">
                        <i class="bi bi-pencil me-1"></i>Edit
                    </button>
                </div>
                <div class="card-body">
                    <div id="profileLoading" class="text-center py-4">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>

                    <form id="profileForm" class="d-none">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">First Name</label>
                                <input type="text" class="form-control" id="firstName" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Last Name</label>
                                <input type="text" class="form-control" id="lastName" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" readonly disabled>
                                <small class="text-muted">Email cannot be changed</small>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Phone</label>
                                <input type="tel" class="form-control" id="phone" readonly>
                            </div>
                        </div>

                        <div id="editButtons" class="mt-4 d-none">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check me-1"></i>Save Changes
                            </button>
                            <button type="button" class="btn btn-outline-secondary ms-2" onclick="cancelEdit()">
                                Cancel
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Change Password Section -->
            <div class="card mb-4 d-none" id="passwordSection">
                <div class="card-header">
                    <h5 class="mb-0"><i class="bi bi-shield-lock me-2"></i>Change Password</h5>
                </div>
                <div class="card-body">
                    <form id="passwordForm">
                        <div class="mb-3">
                            <label class="form-label">Current Password</label>
                            <input type="password" class="form-control" id="currentPassword" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">New Password</label>
                            <input type="password" class="form-control" id="newPassword" required minlength="8">
                            <small class="text-muted">Minimum 8 characters</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Confirm New Password</label>
                            <input type="password" class="form-control" id="confirmPassword" required>
                        </div>
                        <div id="passwordError" class="alert alert-danger d-none"></div>
                        <div id="passwordSuccess" class="alert alert-success d-none"></div>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check me-1"></i>Update Password
                        </button>
                        <button type="button" class="btn btn-outline-secondary ms-2" onclick="hideChangePassword()">
                            Cancel
                        </button>
                    </form>
                </div>
            </div>

            <!-- Account Stats -->
            <div class="row">
                <div class="col-md-4 mb-3">
                    <div class="card text-center h-100">
                        <div class="card-body">
                            <i class="bi bi-box-seam fs-1 text-primary mb-2"></i>
                            <h3 id="totalOrders">0</h3>
                            <p class="text-muted mb-0">Total Orders</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 mb-3">
                    <div class="card text-center h-100">
                        <div class="card-body">
                            <i class="bi bi-heart fs-1 text-danger mb-2"></i>
                            <h3 id="wishlistCount">0</h3>
                            <p class="text-muted mb-0">Wishlist Items</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 mb-3">
                    <div class="card text-center h-100">
                        <div class="card-body">
                            <i class="bi bi-star fs-1 text-warning mb-2"></i>
                            <h3 id="reviewsCount">0</h3>
                            <p class="text-muted mb-0">Reviews Written</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<th:block th:replace="~{fragments/footer :: scripts}"></th:block>

<script>
    let userData = null;
    let isEditing = false;

    document.addEventListener('DOMContentLoaded', loadProfile);

    async function loadProfile() {
        try {
            const response = await fetchWithAuth('/api/profile');
            const data = await response.json();

            if (data.success) {
                userData = data.data;
                renderProfile(userData);
            } else {
                showToast('Failed to load profile', 'error');
            }
        } catch (error) {
            console.error('Error loading profile:', error);
            // Try to load from localStorage as fallback
            const userStr = localStorage.getItem('user');
            if (userStr) {
                userData = JSON.parse(userStr);
                renderProfile(userData);
            }
        }
    }

    function renderProfile(user) {
        document.getElementById('profileLoading').classList.add('d-none');
        document.getElementById('profileForm').classList.remove('d-none');

        document.getElementById('profileName').textContent = `${user.firstName || ''} ${user.lastName || ''}`.trim() || 'User';
        document.getElementById('profileEmail').textContent = user.email || '';

        document.getElementById('firstName').value = user.firstName || '';
        document.getElementById('lastName').value = user.lastName || '';
        document.getElementById('email').value = user.email || '';
        document.getElementById('phone').value = user.phone || '';

        // Load stats
        loadStats();
    }

    async function loadStats() {
        try {
            // Orders count
            const ordersResponse = await fetchWithAuth('/api/orders');
            const ordersData = await ordersResponse.json();
            if (ordersData.success && ordersData.data.content) {
                document.getElementById('totalOrders').textContent = ordersData.data.content.length;
            }
        } catch (e) {
            console.log('Could not load orders count');
        }

        try {
            // Wishlist count
            const wishlistResponse = await fetchWithAuth('/api/wishlist');
            const wishlistData = await wishlistResponse.json();
            if (wishlistData.success && wishlistData.data) {
                document.getElementById('wishlistCount').textContent = wishlistData.data.itemCount || 0;
            }
        } catch (e) {
            console.log('Could not load wishlist count');
        }
    }

    function enableEdit() {
        isEditing = true;
        document.getElementById('firstName').removeAttribute('readonly');
        document.getElementById('lastName').removeAttribute('readonly');
        document.getElementById('phone').removeAttribute('readonly');
        document.getElementById('editButtons').classList.remove('d-none');
    }

    function cancelEdit() {
        isEditing = false;
        document.getElementById('firstName').setAttribute('readonly', true);
        document.getElementById('lastName').setAttribute('readonly', true);
        document.getElementById('phone').setAttribute('readonly', true);
        document.getElementById('editButtons').classList.add('d-none');

        // Reset values
        if (userData) {
            document.getElementById('firstName').value = userData.firstName || '';
            document.getElementById('lastName').value = userData.lastName || '';
            document.getElementById('phone').value = userData.phone || '';
        }
    }

    document.getElementById('profileForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const updateData = {
            firstName: document.getElementById('firstName').value,
            lastName: document.getElementById('lastName').value,
            phone: document.getElementById('phone').value
        };

        try {
            const response = await fetchWithAuth('/api/profile', {
                method: 'PUT',
                body: JSON.stringify(updateData)
            });

            const data = await response.json();

            if (data.success) {
                userData = { ...userData, ...updateData };
                localStorage.setItem('user', JSON.stringify(userData));
                showToast('Profile updated successfully', 'success');
                cancelEdit();
                renderProfile(userData);
            } else {
                showToast(data.message || 'Failed to update profile', 'error');
            }
        } catch (error) {
            showToast('Failed to update profile', 'error');
        }
    });

    function showChangePassword() {
        document.getElementById('profileSection').classList.add('d-none');
        document.getElementById('passwordSection').classList.remove('d-none');
    }

    function hideChangePassword() {
        document.getElementById('passwordSection').classList.add('d-none');
        document.getElementById('profileSection').classList.remove('d-none');
        document.getElementById('passwordForm').reset();
        document.getElementById('passwordError').classList.add('d-none');
        document.getElementById('passwordSuccess').classList.add('d-none');
    }

    document.getElementById('passwordForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const currentPassword = document.getElementById('currentPassword').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        const errorDiv = document.getElementById('passwordError');
        const successDiv = document.getElementById('passwordSuccess');

        errorDiv.classList.add('d-none');
        successDiv.classList.add('d-none');

        if (newPassword !== confirmPassword) {
            errorDiv.textContent = 'New passwords do not match';
            errorDiv.classList.remove('d-none');
            return;
        }

        if (newPassword.length < 8) {
            errorDiv.textContent = 'Password must be at least 8 characters';
            errorDiv.classList.remove('d-none');
            return;
        }

        try {
            const response = await fetchWithAuth('/api/profile/change-password', {
                method: 'POST',
                body: JSON.stringify({
                    currentPassword: currentPassword,
                    newPassword: newPassword
                })
            });

            const data = await response.json();

            if (data.success) {
                successDiv.textContent = 'Password changed successfully';
                successDiv.classList.remove('d-none');
                document.getElementById('passwordForm').reset();
                setTimeout(hideChangePassword, 2000);
            } else {
                errorDiv.textContent = data.message || 'Failed to change password';
                errorDiv.classList.remove('d-none');
            }
        } catch (error) {
            errorDiv.textContent = 'Failed to change password';
            errorDiv.classList.remove('d-none');
        }
    });

    function showAddresses() {
        showToast('Address management coming soon!', 'info');
    }
</script>
</body>
</html>
