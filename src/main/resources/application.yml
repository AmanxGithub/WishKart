spring:
  application:
    name: WishKart

  datasource:
    url: jdbc:h2:file:./data/wishkartdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: false
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

  kafka:
    bootstrap-servers: localhost:29092

  thymeleaf:
    cache: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: 8085
  error:
    include-message: always
    include-binding-errors: always

jwt:
  secret: ${JWT_SECRET:WishKartSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong2024}
  expiration: 86400000
  refresh-expiration: 604800000

stripe:
  api-key: ${STRIPE_API_KEY:sk_test_placeholder}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
  currency: usd

wishkart:
  admin:
    default-email: admin@wishkart.com
    default-password: ${ADMIN_PASSWORD:Admin@123}
  upload:
    path: ./uploads
    max-file-size: 5MB
  pagination:
    default-page-size: 12
  inventory:
    low-stock-threshold: 10

logging:
  level:
    root: INFO
    com.wishkart: DEBUG
    org.springframework.security: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
