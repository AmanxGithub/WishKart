spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  h2:
    console:
      enabled: false

  mail:
    host: localhost
    port: 3025

  autoconfigure:
    exclude:
      - net.devh.boot.grpc.server.autoconfigure.GrpcServerAutoConfiguration
      - net.devh.boot.grpc.server.autoconfigure.GrpcServerFactoryAutoConfiguration
      - net.devh.boot.grpc.server.autoconfigure.GrpcServerSecurityAutoConfiguration
      - net.devh.boot.grpc.server.autoconfigure.GrpcServerMetricAutoConfiguration

jwt:
  secret: TestSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLongForTesting
  expiration: 3600000
  refresh-expiration: 86400000

stripe:
  api-key: sk_test_placeholder
  webhook-secret: whsec_test_placeholder
  currency: usd

wishkart:
  admin:
    default-email: admin@test.com
    default-password: TestAdmin@123
  pagination:
    default-page-size: 10
  inventory:
    low-stock-threshold: 5

# Disable gRPC server for tests
grpc:
  server:
    port: -1

logging:
  level:
    root: WARN
    com.wishkart: DEBUG
